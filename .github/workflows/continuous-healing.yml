name: Continuous Code Healing

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  health-check:
    name: System Health & Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK JSON {path}')
          PY

          python - <<'PY'
          import yaml
          from pathlib import Path

          for path in [*Path('.').rglob('*.yml'), *Path('.').rglob('*.yaml')]:
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'OK YAML {path}')
          PY

      - name: Check working tree
        run: git status --short
